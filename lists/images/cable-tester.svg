  <rect x="38" y="16" width="32" height="14" />
  <path d="M48 16 V22 H60 V16" stroke-width="2" />
  <g stroke-width="2">
    <circle cx="34" cy="48" r="4" /><circle cx="34" cy="62" r="4" /><circle cx="34" cy="76" r="4" /><circle cx="34" cy="90" r="4" />
    <circle cx="74" cy="48" r="4" /><circle cx="74" cy="62" r="4" /><circle cx="74" cy="76" r="4" /><circle cx="74" cy="90" r="4" />
  </g>
  <text x="46" y="68" font-family="monospace" font-size="9" fill="#D8D8D8" stroke="none">1-8</text>
  <rect x="42" y="104" width="24" height="10" rx="3" />
  <!-- remote unit: its own jack and LEDs -->
  <rect x="124" y="50" width="62" height="72" rx="8" />
  <rect x="140" y="40" width="30" height="14" />
  <g stroke-width="2">
    <circle cx="140" cy="72" r="4" /><circle cx="140" cy="86" r="4" /><circle cx="140" cy="100" r="4" /><circle cx="140" cy="114" r="4" />
    <circle cx="170" cy="72" r="4" /><circle cx="170" cy="86" r="4" /><circle cx="170" cy="100" r="4" /><circle cx="170" cy="114" r="4" />
  </g>
